<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toronto Schedule · Weekly Calendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%23BEEA32%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2214%22%20width%3D%2236%22%20height%3D%228%22%20fill%3D%22%230D0D0D%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2230%22%20width%3D%2236%22%20height%3D%224%22%20fill%3D%22%230D0D0D%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2242%22%20width%3D%2220%22%20height%3D%224%22%20fill%3D%22%230D0D0D%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D0D0D; --ink2:#1A1A1A; --paper:#FFFFFF; --paper2:#F7F7F5;
  --line:#E2E2DF; --line2:#EFEFEC;
  --text:#0D0D0D; --muted:#7A7A75; --muted2:#9B9B95;
  --acc:#BEEA32; --acc-soft:#F6FCE2; --acc-deep:#637A1A;
  --miss:#5A5A55; --ok:#BEEA32;
  --slot:15px;
  /* categorias em escala de cinza: quanto mais escuro, mais central ao projeto */
  --c-estudo:#0D0D0D; --c-trabalho:#2E2E2C; --c-treino:#4A4A46;
  --c-corrida:#5E5E59; --c-sauna:#7A7A75; --c-refeicao:#9B9B95;
  --c-rotina:#B4B4AE; --c-sono:#C9C9C3; --c-livre:#BEEA32;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--text);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{max-width:1720px;margin:0 auto;padding:0;height:100%;display:flex;flex-direction:column;min-height:0}
header.top,.progband,#banner{flex:none}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;
  background:var(--ink);color:#fff;padding:11px 24px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--acc);text-transform:uppercase}
h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:2px;color:#fff;line-height:1.15}
h1 .range{color:#8E8E88;font-weight:500}
.sun{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#8E8E88;margin-top:2px}
.stats{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:3px}
.progband{background:#232320;padding:9px 24px;border-bottom:1px solid #2E2E2B}
.prog{display:grid;grid-template-columns:repeat(4,minmax(110px,180px));gap:6px 18px}
.progband .pg .pb{background:#3A3A36}
.pg .pl{display:flex;justify-content:space-between;align-items:baseline;font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;letter-spacing:.1em;color:#8E8E88;margin-bottom:3px;text-transform:uppercase}
.pg .pl b{color:#fff;font-weight:700;font-size:10.5px;letter-spacing:0}
.pg .pb{height:5px;background:#2B2B29;overflow:hidden}
.pg .pb i{display:block;height:100%;transition:width .4s ease}
@media (max-width:640px){ .prog{grid-template-columns:repeat(2,1fr)} }
.nav{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid #3A3A37;color:#fff;
  font-family:'Archivo';font-weight:600;font-size:11px;padding:4px 10px;border-radius:0;cursor:pointer;
  transition:background .15s ease,border-color .15s ease,color .15s ease}
.nav button:hover{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.nav button:disabled{opacity:.3;cursor:default}
.nav button:disabled:hover{background:transparent;border-color:#3A3A37;color:#fff}
.nav button.ghost{font-size:9.5px;color:#8E8E88;border-color:#2B2B29;font-weight:500;padding:4px 8px}
#banner{display:none;margin:0;padding:9px 24px;border-bottom:1px solid var(--line);
  background:var(--acc-soft);font-size:12px;color:var(--acc-deep)}
.scroller{flex:1;min-height:0;overflow:auto;border-bottom:1px solid var(--line);background:var(--paper);
  overscroll-behavior:contain}
.cal{min-width:1020px}
.cal-head{display:grid;grid-template-columns:64px repeat(7,1fr);position:sticky;top:0;z-index:6;
  background:var(--paper);border-bottom:2px solid var(--ink);box-shadow:0 1px 0 var(--ink)}
.day-head{padding:12px 10px 10px;border-left:1px solid var(--line2);min-height:86px}
.day-head .dow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.day-head .dt{font-size:18px;font-weight:700;margin:3px 0 7px;letter-spacing:-.02em}
.day-head.today .dt{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;
  padding:0 8px;background:var(--acc);color:var(--ink);margin:2px 0 6px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
  background:var(--ink);color:#fff;padding:3px 8px;letter-spacing:.06em}
.badge.off{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.badge small{font-weight:500;opacity:.65}
.pills{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);
  background:var(--paper2);border:1px solid var(--line);padding:2px 6px}
.pill.warn{color:var(--ink);background:var(--acc);border-color:var(--acc);font-weight:600}
.pill.miss{color:#fff;background:var(--muted);border-color:var(--muted)}
.cal-body{display:grid;grid-template-columns:64px repeat(7,1fr)}
.gutter{position:relative;height:calc(var(--slot)*72)}
.skyband{position:absolute;right:6px;top:0;width:4px;height:100%;opacity:.9}
.hlabel{position:absolute;right:16px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted2)}
.day-col{position:relative;height:calc(var(--slot)*72);border-left:1px solid var(--line2);
  background:repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--slot)*4 - 1px),var(--line2) calc(var(--slot)*4 - 1px),var(--line2) calc(var(--slot)*4))}
.day-col.today{background:linear-gradient(0deg,rgba(190,234,50,.08),rgba(190,234,50,.08)),
  repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--slot)*4 - 1px),var(--line2) calc(var(--slot)*4 - 1px),var(--line2) calc(var(--slot)*4))}
.blk{position:absolute;left:4px;right:4px;padding:2px 8px;overflow:hidden;font-size:10.5px;line-height:1.28}
.blk .t{font-family:'IBM Plex Mono',monospace;font-size:9px;opacity:.55;display:block}
.blk .l{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.blk.tiny{padding:0 8px;font-size:9px;display:flex;align-items:center}
.blk.tiny .l{font-weight:500;white-space:nowrap}
.blk.dashed{border-style:dashed}
.blk.done{background:var(--acc-soft)!important;border-left-color:var(--acc)!important;color:var(--acc-deep)!important}
.blk.missed{opacity:.4}
.blk.missed .l{text-decoration:line-through}
.mark{position:absolute;top:3px;right:3px;width:20px;height:20px;
  border:1px solid var(--line);background:#fff;color:var(--muted);
  font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mark:hover{border-color:var(--ink)}
.mark:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.mark.s1{color:var(--ink);background:var(--acc);border-color:var(--acc);font-weight:700}
.mark.s2{color:#fff;background:var(--muted);border-color:var(--muted);font-weight:700}
.offplan{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper2)}
.offplan span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted2);
  transform:rotate(-90deg);white-space:nowrap;letter-spacing:.2em;text-transform:uppercase}
@media (min-width:1280px){
  header.top{padding:13px 32px}
  #banner{padding-left:32px;padding-right:32px}
  .progband{padding:10px 32px}
  h1{font-size:22px}
  .eyebrow{font-size:10.5px}
  .sun,.stats{font-size:10.5px}
  .day-head .dow{font-size:11px}
  .day-head .dt{font-size:20px}
  .badge{font-size:11px}
  .pill{font-size:10px}
  .hlabel{font-size:11px}
  .blk{font-size:12px;left:5px;right:5px;padding:3px 10px}
  .blk .t{font-size:10px}
  .blk.tiny{font-size:10.5px;padding:0 10px}
  .mark{width:22px;height:22px;font-size:13px}
}
@media (max-width:640px){ h1{font-size:20px} header.top{padding:14px 14px} #banner,.progband{padding-left:14px;padding-right:14px} }
@media (prefers-reduced-motion:reduce){ .pg .pb i,.nav button{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Toronto · CFA Feb 2027 · C D A B OFF cycle</div>
      <h1 id="weekTitle"></h1>
      <div class="sun" id="sunInfo"></div>
    </div>
    <div class="nav">
      <button id="prevBtn" aria-label="Previous week">&#8249; previous</button>
      <button id="todayBtn">this week</button>
      <button id="nextBtn" aria-label="Next week">next &#8250;</button>
      <button id="resetBtn" class="ghost">clear marks</button>
      <button id="exportBtn" class="ghost">export</button>
      <button id="importBtn" class="ghost">import</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    </div>
  </header>
  <div class="progband"><div class="prog" id="stats"></div></div>
  <div id="banner">No storage available: marks will only last for this session.</div>
  <div class="scroller"><div class="cal">
    <div class="cal-head" id="calHead"></div>
    <div class="cal-body" id="calBody"></div>
  </div></div>
</div>
<script>
/*__LOGIC_START__*/
const DAY=86400000;
const U=(y,m,d)=>Date.UTC(y,m-1,d);
const ANCHOR=U(2026,8,2), PLAN_END=U(2026,10,31);
const SEQ=["C","D","A","B","OFF"];
const MUSC={C:"legs",D:"shoulders",A:"chest",B:"back"};
const TRL_HOLS=new Set([U(2026,8,3),U(2026,9,7),U(2026,9,30),U(2026,10,12)]);
const GYM_LATE=new Set([U(2026,8,3)]);
const NEWSCHED=U(2026,8,10);
const TRL_START=U(2026,8,13), TRL_END=U(2026,8,21); // full-access window before reduced hours
const TRL_CLOSED=new Set([U(2026,8,18)]); // planned full-day renovation closure // Avant holiday hours: opens 6:00
const RUN_KM={
  [U(2026,8,3)]:4,[U(2026,8,5)]:4,[U(2026,8,8)]:8,
  [U(2026,8,10)]:4.5,[U(2026,8,13)]:4.5,[U(2026,8,15)]:8,
  [U(2026,8,18)]:4,[U(2026,8,20)]:4,[U(2026,8,22)]:8,[U(2026,8,23)]:4,
  [U(2026,8,25)]:4,[U(2026,8,28)]:4,[U(2026,8,29)]:10,[U(2026,8,30)]:4,
  [U(2026,9,2)]:5,[U(2026,9,4)]:5,[U(2026,9,5)]:12,
  [U(2026,9,7)]:5.5,[U(2026,9,9)]:5.5,[U(2026,9,12)]:14,
  [U(2026,9,14)]:5.5,[U(2026,9,17)]:5.5,[U(2026,9,19)]:16,
  [U(2026,9,22)]:4,[U(2026,9,24)]:4,[U(2026,9,26)]:9,[U(2026,9,27)]:4,
  [U(2026,9,29)]:4.5,[U(2026,10,2)]:4.5,[U(2026,10,3)]:18,[U(2026,10,4)]:4,
  [U(2026,10,7)]:5,[U(2026,10,9)]:4,[U(2026,10,10)]:12,
  [U(2026,10,12)]:5,[U(2026,10,14)]:5,[U(2026,10,17)]:16,
  [U(2026,10,19)]:5,[U(2026,10,22)]:5,[U(2026,10,24)]:18,
  [U(2026,10,27)]:5,[U(2026,10,29)]:5,[U(2026,10,31)]:8
};
const EVENTS={
  [U(2026,8,6)]:{txt:"Buy: Electric Island · Sep 6",warn:true},
  [U(2026,8,31)]:{txt:"TIFF public tickets · 12:00",warn:true},
  [U(2026,9,6)]:{txt:"Electric Island · PAWSA · Fort York · 14:30-22:00",warn:true},
  [U(2026,9,10)]:{txt:"TIFF ’26 begins (to Sep 20)"},
  [U(2026,9,18)]:{txt:"Kensington Jazz Fest begins (to Sep 20)"},
  [U(2026,9,19)]:{txt:"Kensington Jazz Fest · Kensington Market"},
  [U(2026,9,20)]:{txt:"TIFF ’26 final day · Kensington Jazz Fest final day"},
  [U(2026,10,3)]:{txt:"Nuit Blanche · 19:00-07:00 · free"}
};
const B3_HOLS=new Set([U(2026,9,7),U(2026,10,12)]);
const OBRAS=U(2026,8,15);
const mm=(h,m)=>h*60+(m||0);
function dow(t){ const d=new Date(t).getUTCDay(); return d===0?7:d; }
function fmt(t){ const d=new Date(t); return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0"); }
function key(t){ const d=new Date(t); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
// marks: {w:{"YYYY-MM-DD":1|2}, r:{"YYYY-MM-DD_short":1|2, "YYYY-MM-DD_long":1|2}}
// 1 = done · 2 = not done. Only 2 in marks.w slides the cycle.
function buildTimeline(marks){
  const tl={}; let idx=0;
  for(let t=ANCHOR;t<=PLAN_END;t+=DAY){
    const planned=SEQ[idx%5];
    const info={ficha:planned};
    if(planned==="OFF"){ idx++; }
    else{
      const st=marks.w[key(t)]||0;
      if(st===2){ info.missed=true; }        // cycle does not advance: workout slides
      else { idx++; if(st===1) info.done=true; }
    }
    tl[t]=info;
  }
  return tl;
}
function longRepo(marks,tl){
  const repo=new Set();
  for(let t=ANCHOR;t<=PLAN_END;t+=DAY){
    if(dow(t)===6 && marks.r[key(t)+"_long"]===2){
      const sun=t+DAY;
      if(sun<=PLAN_END && tl[sun] && tl[sun].ficha==="OFF") repo.add(sun);
    }
  }
  return repo;
}
const B=(s,e,label,cat,sub)=>({s,e,label,cat,sub:sub||null});
function markable(b,type,t){ b.mark={type,k:key(t)+(type==="w"?"":type==="short"?"_short":"_long")}; return b; }
function eveningWeekday(t){ return t>=NEWSCHED ? [
  B(mm(18,0),mm(20,0),"CFA Study \u00b7 QBank & Review","estudo"),
  B(mm(20,0),mm(21,0),"Dinner (Main Meal)","refeicao"),
  B(mm(21,0),mm(21,30),"Reading / Other","rotina"),
  B(mm(21,30),mm(21,45),"Shower","rotina"),
  B(mm(21,45),mm(22,0),"Go to Bed","rotina"),
  B(mm(22,0),mm(24,0),"Sleep","sono")] : [
  B(mm(18,0),mm(19,0),"Dinner (Main Meal)","refeicao"),
  B(mm(19,0),mm(19,30),"Reading / Other","rotina"),
  B(mm(19,30),mm(19,45),"Shower","rotina"),
  B(mm(19,45),mm(20,0),"Go to Bed","rotina"),
  B(mm(20,0),mm(22,0),"Sleep","sono")];}
function studyWeekday(t){ if(t<NEWSCHED) return [B(mm(8,0),mm(13,0),"CFA Study (Home)","estudo")];
  const trl=(t>=TRL_START&&t<=TRL_END&&!TRL_CLOSED.has(t));
  return trl
    ? [B(mm(9,45),mm(10,0),"Walk to TRL","rotina"),B(mm(10,0),mm(13,30),"CFA Study (TRL)","estudo")]
    : [B(mm(10,0),mm(13,30),"CFA Study (Home)","estudo")];}
function workBlock(t){ return B3_HOLS.has(t)
  ? Object.assign(B(mm(14,30),mm(18,0),"Optional Work","trabalho","B3 closed"),{dashed:true})
  : B(mm(14,30),mm(18,0),"Work Window","trabalho");}
function blocksFor(t,tl,repo,marks){
  const info=tl[t]; if(!info) return null;
  const f=info.ficha, d=dow(t), blocks=[];
  const rs=k2=>marks.r[k2]||0;
  const sh=(t>=NEWSCHED?120:0);
  if(d<=5){
    if(f==="OFF"){
      blocks.push(B(mm(4,0)+sh,mm(4,15)+sh,"Wake-up","rotina"),
        B(mm(4,15)+sh,mm(4,45)+sh,"Breakfast","refeicao"),
        B(mm(4,45)+sh,mm(5,0)+sh,"Shower","rotina"),
        B(mm(5,0)+sh,mm(5,15)+sh,"Dressing + Prep","rotina"),
        B(mm(5,15)+sh,mm(7,30)+sh,"Extra CFA Study (Home)","estudo"),
        B(mm(7,30)+sh,mm(8,0)+sh,"Breakfast","refeicao"));
    } else if(info.missed){
      blocks.push(Object.assign(markable(B(mm(5,0)+sh,mm(7,30)+sh,"Workout "+f+" not done · rest","treino"),"w",t),{missed:true}),
        B(mm(7,30)+sh,mm(8,0)+sh,"Breakfast","refeicao"));
    } else {
      const late=GYM_LATE.has(t)?60:sh;
      blocks.push(B(mm(4,0)+late,mm(4,15)+late,"Wake-up","rotina"),
        B(mm(4,15)+late,mm(4,30)+late,"Pre-training","refeicao"),
        B(mm(4,30)+late,mm(4,45)+late,"Shower","rotina"),
        B(mm(4,45)+late,mm(5,0)+late,"Dressing + Prep + Transit","rotina"),
        Object.assign(markable(B(mm(5,0)+late,mm(6,30)+late,"Workout "+f+" · "+MUSC[f]+"","treino"),"w",t),{done:!!info.done}));
      if(f==="D"||f==="B"){
        const b=markable(B(mm(6,30)+late,mm(7,15)+late,"Treadmill Short Run · "+(RUN_KM[t]??"5-7.5")+" km @ 10-10.5 km/h","corrida"),"short",t);
        const st=rs(b.mark.k); if(st===1)b.done=true; if(st===2)b.missed=true;
        blocks.push(b,B(mm(7,15)+late,mm(7,30)+late,"Shower","rotina"));
      } else {
        blocks.push(B(mm(6,30)+late,mm(7,0)+late,"Dry Sauna","sauna"),
          B(mm(7,0)+late,mm(7,15)+late,"Shower","rotina"));
      }
      blocks.push(B(mm(7,30)+late,mm(8,0)+late,"Breakfast","refeicao"));
    }
    const lateStudy=GYM_LATE.has(t)&&f!=="OFF"&&!info.missed;
    blocks.push(...(lateStudy?[B(mm(9,0),mm(13,0),"CFA Study (Home)","estudo")]:studyWeekday(t)),
      B(mm(13,0)+(t>=NEWSCHED?30:0),mm(14,30),"Lunch Break","refeicao"),
      workBlock(t), ...eveningWeekday(t));
  } else if(d===6){
    const ws=(t>=NEWSCHED?180:0);
    if(f==="OFF"){
      blocks.push(B(mm(6,45)+ws,mm(7,0)+ws,"Wake-up","rotina"),
        B(mm(7,0)+ws,mm(7,30)+ws,"Coffee + Prep","refeicao"));
    } else if(info.missed){
      blocks.push(Object.assign(markable(B(mm(6,0)+ws,mm(7,30)+ws,"Workout "+f+" not done · rest","treino"),"w",t),{missed:true}));
    } else {
      blocks.push(B(mm(5,0)+ws,mm(5,15)+ws,"Wake-up","rotina"),
        B(mm(5,15)+ws,mm(5,30)+ws,"Pre-training","refeicao"),
        B(mm(5,30)+ws,mm(5,45)+ws,"Shower","rotina"),
        B(mm(5,45)+ws,mm(6,0)+ws,"Dressing + Prep + Transit","rotina"),
        Object.assign(markable(B(mm(6,0)+ws,mm(7,30)+ws,"Workout "+f+" · "+MUSC[f]+"","treino"),"w",t),{done:!!info.done}));
    }
    const isC=(!info.missed&&f==="C");
    const lb=markable(B(mm(7,30)+ws,mm(9,0)+ws,(isC?"Long Run (easy) · "+(RUN_KM[t]??"8-10")+" km @ 9 km/h":"Street Long Run · "+(RUN_KM[t]??"10-12")+" km @ 9-9.6 km/h"),"corrida",
      isC?"legs + long run":(f==="OFF"?"fresh legs":null)),"long",t);
    const st=rs(lb.mark.k); if(st===1)lb.done=true; if(st===2)lb.missed=true;
    blocks.push(lb,
      B(mm(9,0)+ws,mm(9,30)+ws,"Breakfast","refeicao"),
      B(mm(9,30)+ws,mm(9,45)+ws,"Shower","rotina"));
    if(t<NEWSCHED) blocks.push(B(mm(9,45),mm(10,0),"Dressing + Prep","rotina"),
      B(mm(10,0),mm(13,0),"CFA Study (Home)","estudo"),
      B(mm(13,0),mm(14,30),"Lunch Break","refeicao"));
  } else {
    const ws=(t>=NEWSCHED?60:0);
    const hasRepo=repo.has(t);
    if(f==="OFF"){
      if(hasRepo){
        const lb=markable(B(mm(7,30)+ws,mm(9,0)+ws,"Street Long Run · make-up @ 9-9.6 km/h","corrida","fresh legs"),"long",t);
        const st=rs(lb.mark.k); if(st===1)lb.done=true; if(st===2)lb.missed=true;
        blocks.push(B(mm(7,0)+ws,mm(7,30)+ws,"Coffee + Prep","refeicao"),
          lb);
      } else {
        }
    } else if(info.missed){
      blocks.push(Object.assign(markable(B(mm(6,0)+ws,mm(8,15)+ws,"Workout "+f+" not done · rest","treino"),"w",t),{missed:true}));
    } else {
      blocks.push(B(mm(5,0)+ws,mm(5,15)+ws,"Wake-up","rotina"),
        B(mm(5,15)+ws,mm(5,30)+ws,"Pre-training","refeicao"),
        B(mm(5,30)+ws,mm(5,45)+ws,"Shower","rotina"),
        B(mm(5,45)+ws,mm(6,0)+ws,"Dressing + Prep + Transit","rotina"),
        Object.assign(markable(B(mm(6,0)+ws,mm(7,30)+ws,"Workout "+f+" · "+MUSC[f]+"","treino"),"w",t),{done:!!info.done}));
      if(f==="D"||f==="B"){
        const b=markable(B(mm(7,30)+ws,mm(8,15)+ws,"Treadmill Short Run · "+(RUN_KM[t]??"5-7.5")+" km @ 10-10.5 km/h","corrida"),"short",t);
        const st=rs(b.mark.k); if(st===1)b.done=true; if(st===2)b.missed=true;
        blocks.push(b);
      } else {
        blocks.push(B(mm(7,30)+ws,mm(8,15)+ws,"Dry Sauna","sauna"));
      }
      blocks.push(B(mm(8,15)+ws,mm(8,45)+ws,"Breakfast","refeicao"));
    }
    blocks.push(B(mm(19,30)+sh,mm(19,45)+sh,"Shower","rotina"),
      B(mm(19,45)+sh,mm(20,0)+sh,"Go to Bed","rotina"),
      B(mm(20,0)+sh,mm(22,0)+sh,"Sleep","sono"));
  }
  return blocks;
}
function notesFor(t,tl,repo){
  const info=tl[t]; if(!info) return [];
  const f=info.ficha, d=dow(t), out=[];
  if(info.missed) out.push({txt:"workout "+f+" slides",miss:true});
  if(d===6&&f==="C"&&!info.missed) out.push({txt:"legs + long run",warn:true});
  if(d===6&&f==="OFF") out.push({txt:"long run · fresh legs"});
  if(d===7&&f==="OFF") out.push({txt:repo.has(t)?"free + make-up long run":"100% free day"});
  if(GYM_LATE.has(t)) out.push({txt:"Avant opens 6:00 (holiday)",warn:true});
  if(TRL_CLOSED.has(t)) out.push({txt:"TRL closed all day \u00b7 study at home",warn:true});
  else if(t>=TRL_START&&t<=TRL_END&&d<=5) out.push({txt:"TRL \u00b7 9:00-20:30"});
  if(t===U(2026,8,24)) out.push({txt:"TRL reduced hours from today (11:00)",warn:true});
  if(t>=NEWSCHED&&d===6) out.push({txt:"CFA study · 3h · your call"});
  if(EVENTS[t]) out.push(EVENTS[t]);
  if(B3_HOLS.has(t)) out.push({txt:"B3 closed"});
  if(t===PLAN_END) out.push({txt:"return flight",warn:true});
  return out;
}
function offPlanLabel(t){
  if(t===U(2026,7,30)) return "GRU-BOG-YYZ flight";
  if(t===U(2026,7,31)) return "arrival in Toronto";
  if(t===U(2026,8,1)) return "settling in · rest";
  if(t>PLAN_END) return "back in Brazil";
  return "pre-plan";
}
function sunTimes(mondayT){
  const mid=mondayT+3*DAY;
  let x=(mid-ANCHOR)/(PLAN_END-ANCHOR); x=Math.min(1,Math.max(0,x));
  const sr=363+x*(478-363), ss=1244+x*(1087-1244);
  return {sr,ss};
}
function statsFor(marks){
  const c=v=>Object.values(v).reduce((a,s)=>(a[s]=(a[s]||0)+1,a),{});
  const w=c(marks.w), r=c(marks.r);
  return {wOk:w[1]||0,wMiss:w[2]||0,rOk:r[1]||0,rMiss:r[2]||0};
}
function plannedCounts(){
  let wk=0, rn=0;
  const seq=["C","D","A","B","OFF"]; let idx=0;
  for(let t=ANCHOR;t<=PLAN_END;t+=DAY){
    const f=seq[idx%5]; idx++;
    const d=dow(t);
    if(f!=="OFF") wk++;
    if(d===6) rn++;                       // long run every Saturday
    else if(f==="D"||f==="B") rn++;       // short runs on D and B
  }
  return {wk,rn};
}
function studyProgress(){
  let n=0, seen=false;
  try{
    const raw=localStorage.getItem(KAPLAN_KEY);
    if(raw){ seen=true;
      const dn=(JSON.parse(raw)||{}).done||{};
      for(const k in dn){ if(dn[k]) n++; } }
  }catch(e){}
  return {done:n,total:KAPLAN_ALL,seen};
}
function progressBars(marks){
  const today=todayUTC();
  const totalDays=Math.round((PLAN_END-ANCHOR)/DAY)+1;
  const elapsed=Math.min(totalDays,Math.max(0,Math.round((today-ANCHOR)/DAY)+1));
  const pl=plannedCounts(), st=statsFor(marks), sp=studyProgress();
  const bars=[
    {lab:"season",   v:elapsed,   n:totalDays, c:"var(--acc)",       txt:elapsed+"/"+totalDays+" d"},
    {lab:"study (full plan)",    v:sp.done, n:sp.total, c:"var(--acc)",
     txt:sp.done+"/"+sp.total+(sp.seen?"":" \u00b7 tick in kaplan.html")},
    {lab:"workouts", v:st.wOk,    n:pl.wk, c:"var(--acc)",  txt:st.wOk+"/"+pl.wk},
    {lab:"running",  v:st.rOk,    n:pl.rn, c:"var(--acc)", txt:st.rOk+"/"+pl.rn}
  ];
  return bars.map(b=>{
    const pct=b.n?Math.min(100,Math.round(b.v/b.n*1000)/10):0;
    return "<div class='pg'><div class='pl'><span>"+b.lab+"</span><b>"+pct.toFixed(1)+"%</b></div>"+
      "<div class='pb'><i style='width:"+pct+"%;background:"+b.c+"'></i></div>"+
      "<div class='pl' style='margin:3px 0 0'><span>"+b.txt+"</span></div></div>";
  }).join("");
}
/*__LOGIC_END__*/

const FIRST_MON=U(2026,7,27), LAST_MON=U(2026,10,26);
const STORE_KEY="toronto_rotina_marks";
const KAPLAN_KEY="kaplan.v1", KAPLAN_ALL=769; // full CFA plan: Toronto + Brazil, to exam day
const CATS=[["treino","Workout"],["corrida","Running"],["sauna","Sauna"],["estudo","CFA Study"],
  ["trabalho","Work"],["refeicao","Meals"],["rotina","Routine"],["sono","Sleep"]];
const DOWS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MESES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let monday=U(2026,8,3);
let marks={w:{},r:{}};
let persist=true;
async function loadMarks(){
  try{ if(typeof window!=="undefined"&&window.storage){
    const r=await window.storage.get(STORE_KEY);
    if(r&&r.value){ marks=JSON.parse(r.value); return; } return; } }catch(e){}
  try{ const v=localStorage.getItem(STORE_KEY); if(v){ marks=JSON.parse(v); } return; }catch(e){}
  persist=false;
}
async function saveMarks(){
  const s=JSON.stringify(marks); let ok=false;
  try{ if(typeof window!=="undefined"&&window.storage){ await window.storage.set(STORE_KEY,s); ok=true; } }catch(e){}
  if(!ok){ try{ localStorage.setItem(STORE_KEY,s); ok=true; }catch(e){} }
  if(!ok){ persist=false; document.getElementById("banner").style.display="block"; }
}
function todayUTC(){ const n=new Date(); return U(n.getFullYear(),n.getMonth()+1,n.getDate()); }
function hhmm(min){ return String(Math.floor(min/60)).padStart(2,"0")+":"+String(Math.round(min%60)).padStart(2,"0"); }
function skyGradient(sr,ss,h0){
  const p=min=>((min-h0*60)/1080*100).toFixed(2)+"%";
  return `linear-gradient(180deg,#DDDDD9 0%,#DDDDD9 ${p(sr-50)},#BEEA32 ${p(sr)},#F1FAD2 ${p(sr+60)},#F7F7F5 ${p((sr+ss)/2)},#F1FAD2 ${p(ss-60)},#BEEA32 ${p(ss)},#DDDDD9 ${p(ss+50)},#DDDDD9 100%)`;
}
function cycleMark(store,k){
  const cur=store[k]||0, next=(cur+1)%3;
  if(next===0) delete store[k]; else store[k]=next;
}
function render(){
  const tl=buildTimeline(marks), repo=longRepo(marks,tl);
  const head=document.getElementById("calHead"), body=document.getElementById("calBody");
  head.innerHTML=""; body.innerHTML="";
  const wknum=Math.round((monday-FIRST_MON)/DAY/7);
  const {sr,ss}=sunTimes(monday);
  const d0=new Date(monday), d6=new Date(monday+6*DAY);
  const range=String(d0.getUTCDate()).padStart(2,"0")+" "+MESES[d0.getUTCMonth()]+" - "+String(d6.getUTCDate()).padStart(2,"0")+" "+MESES[d6.getUTCMonth()];
  document.getElementById("weekTitle").innerHTML=(wknum===0?"Week 0 · arrival":"Week "+wknum)+" <span class='range'>"+range+"</span>";
  document.getElementById("sunInfo").textContent="daylight (approx.): "+hhmm(sr)+" - "+hhmm(ss);
  document.getElementById("stats").innerHTML=progressBars(marks);
  head.insertAdjacentHTML("beforeend","<div class='day-head' style='border:0'></div>");
  const tUTC=todayUTC();
  for(let i=0;i<7;i++){
    const t=monday+i*DAY, info=tl[t];
    const isToday=t===tUTC;
    let badge= !info?"" : info.ficha==="OFF"
      ? "<span class='badge off'>OFF</span>"
      : "<span class='badge'"+(info.missed?" style='opacity:.45'":"")+">"+info.ficha+" <small>"+MUSC[info.ficha]+"</small></span>";
    const pills=notesFor(t,tl,repo).map(n=>"<span class='pill"+(n.warn?" warn":"")+(n.miss?" miss":"")+"'>"+n.txt+"</span>").join("");
    head.insertAdjacentHTML("beforeend",
      "<div class='day-head"+(isToday?" today":"")+"'><div class='dow'>"+DOWS[i]+"</div><div class='dt'>"+fmt(t)+"</div>"+badge+"<div class='pills'>"+pills+"</div></div>");
  }
  const H0=(monday>=NEWSCHED?6:4);
  let g="<div class='gutter'><div class='skyband' style='background:"+skyGradient(sr,ss,H0)+"'></div>";
  for(let h=H0;h<=H0+18;h++){
    const tr=h===H0?"translateY(0)":(h===H0+18?"translateY(-100%)":"translateY(-50%)");
    g+="<div class='hlabel' style='top:"+((h-H0)*4*15)+"px;transform:"+tr+"'>"+String(h%24).padStart(2,"0")+":00</div>";
  }
  g+="</div>";
  body.insertAdjacentHTML("beforeend",g);
  for(let i=0;i<7;i++){
    const t=monday+i*DAY, blocks=blocksFor(t,tl,repo,marks);
    const isToday=t===tUTC;
    const col=document.createElement("div");
    col.className="day-col"+(isToday?" today":"");
    if(blocks===null){
      col.innerHTML="<div class='offplan'><span>"+offPlanLabel(t)+"</span></div>";
    } else {
      for(const b of blocks){
        const top=b.s-H0*60, h=b.e-b.s;
        const c="var(--c-"+b.cat+")";
        const tiny=h<=15;
        const el=document.createElement("div");
        el.className="blk"+(tiny?" tiny":"")+(b.done?" done":"")+(b.missed?" missed":"");
        el.style.cssText="top:"+top+"px;height:"+(h-2)+"px;background:color-mix(in srgb,"+c+" 9%,#fff);color:color-mix(in srgb,"+c+" 88%,#000);border-left:3px solid "+c+";"+(b.dashed?"border:1px dashed "+c+";border-left:3px solid "+c+";":"");
        el.title=hhmm(b.s)+" - "+hhmm(b.e)+" · "+b.label+(b.sub?" ("+b.sub+")":"");
        let inner="";
        if(!tiny&&h>=45) inner+="<span class='t'>"+hhmm(b.s)+" - "+hhmm(b.e)+(b.sub?" · "+b.sub:"")+"</span>";
        inner+="<span class='l'>"+b.label+"</span>";
        el.innerHTML=inner;
        if(b.mark){
          const store=b.mark.type==="w"?marks.w:marks.r;
          const stv=store[b.mark.k]||0;
          const btn=document.createElement("button");
          btn.className="mark"+(stv===1?" s1":stv===2?" s2":"");
          btn.textContent=stv===1?"\u2713":stv===2?"\u2717":"\u25CB";
          btn.title=stv===1?"done (tap: not done)":stv===2?"not done (tap: clear)":"mark as done";
          btn.setAttribute("aria-label",btn.title);
          btn.addEventListener("click",ev=>{ ev.stopPropagation();
            cycleMark(store,b.mark.k); saveMarks(); render(); });
          el.appendChild(btn);
        }
        col.appendChild(el);
      }
    }
    body.appendChild(col);
  }
  document.getElementById("prevBtn").disabled=monday<=FIRST_MON;
  document.getElementById("nextBtn").disabled=monday>=LAST_MON;
}
function shift(w){ const nm=monday+w*7*DAY; if(nm<FIRST_MON||nm>LAST_MON) return; monday=nm; render(); }
if(typeof document!=="undefined"){
  document.getElementById("prevBtn").addEventListener("click",()=>shift(-1));
  document.getElementById("nextBtn").addEventListener("click",()=>shift(1));
  document.getElementById("todayBtn").addEventListener("click",()=>{
    const t=todayUTC(), off=(dow(t)-1)*DAY; let m=t-off;
    if(m<FIRST_MON)m=FIRST_MON; if(m>LAST_MON)m=LAST_MON; monday=m; render();
  });
  document.getElementById("resetBtn").addEventListener("click",()=>{
    if(confirm("Clear all done and not-done marks?")){
      marks={w:{},r:{}}; saveMarks(); render();
    }
  });
  document.getElementById("exportBtn").addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify(marks,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="schedule-marks-"+new Date().toISOString().slice(0,10)+".json";
    a.click(); URL.revokeObjectURL(a.href);
  });
  document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change",ev=>{
    const f=ev.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{ const data=JSON.parse(rd.result);
        if(data&&typeof data==="object"&&data.w&&data.r){ marks=data; saveMarks(); render(); }
        else alert("Invalid file: use the JSON exported by this calendar.");
      }catch(e){ alert("Could not read the file: "+e.message); } };
    rd.readAsText(f); ev.target.value="";
  });
  document.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft")shift(-1); if(e.key==="ArrowRight")shift(1); });
  (function(){ const t=todayUTC(), off=(dow(t)-1)*DAY; let m=t-off;
    if(m<FIRST_MON)m=FIRST_MON; if(m>LAST_MON)m=LAST_MON; monday=m; })();
  loadMarks().then(render);
}
</script>
